<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenang Bu: Pendamping Harian Ibu dan Balita</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--bg:#FFF5F0;--sf:#fff;--tx:#3A2E39;--mt:#7A6270;--pr:#C93F63;--pt:#fff;--ac:#FFD97A;--ln:#F7DDD8;--wn:#B8431F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:640px;margin:0 auto;padding:18px 16px 96px}
h1{font-size:30px;line-height:1.15;margin:6px 0 4px;font-weight:800}
h2{font-size:19px;margin:0 0 8px;font-weight:800}
h3{font-size:16px;margin:12px 0 4px;font-weight:800}
p{margin:6px 0}ul{margin:6px 0;padding-left:20px}li{margin:4px 0}
.mt{color:var(--mt)}.sm{font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
.note{font-size:13px;color:var(--mt);border-left:3px solid var(--ac);padding-left:10px;margin:14px 0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#C93F63,#E0677F);color:var(--pt);border:0;border-radius:20px;padding:22px 20px;margin:14px 0}
.hero b{display:block;font-size:22px;font-weight:800}.hero span{opacity:.9}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:12px;padding:11px 18px;font-weight:800;transition:opacity 0.2s}
.btn.g{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--bg);border:1.5px solid var(--ln);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:800}
details{border-top:1px solid var(--ln);padding:10px 0}details:first-of-type{border-top:0}
summary{font-weight:800;cursor:pointer}
.say{background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:600}
.no{color:var(--wn);font-weight:600}
.tag{font-size:12px;background:var(--ac);color:#2B2433;border-radius:6px;padding:1px 7px;font-weight:800;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mt)}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--pr);font-weight:800}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.ban{background:var(--ac);color:#2B2433;border-radius:12px;padding:10px 14px;font-weight:800;margin:8px 0}
.br{width:130px;height:130px;border-radius:50%;background:var(--pr);color:var(--pt);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;margin:18px auto;transition:transform 4s ease-in-out;padding:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--ln)}.dots i.on{background:var(--pr)}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:8px 0}label.ck input{margin-top:5px;width:18px;height:18px;accent-color:var(--pr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;z-index:30}

/* CSS Khusus Login */
.auth-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.auth-card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:24px 20px;width:100%;max-width:380px;box-shadow:0 8px 24px rgba(58,46,57,0.05)}
.auth-badge{display:inline-block;background:var(--ac);color:#2B2433;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.input-field{width:100%;padding:12px 14px;margin:6px 0 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:none;transition:border-color 0.2s;box-sizing:border-box}
.input-field:focus{border-color:var(--pr);background:var(--sf)}
.auth-err{display:none;background:#FDF2F0;border:1px solid var(--ln);color:var(--wn);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px}

@media (prefers-reduced-motion:reduce){.br{transition:none}}
</style>
</head>
<body>

<!-- HALAMAN LOGIN (OVERLAY) -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:16px;">
      <span class="auth-badge">Akses Khusus Pembeli</span>
      <h1>Tenang, Bu.</h1>
      <p class="mt sm" style="margin:0;">Masukkan Email & No HP yang kamu gunakan saat order di Lynk.id untuk masuk.</p>
    </div>

    <div id="auth-error" class="auth-err"></div>

    <form onsubmit="handleLogin(event)">
      <label class="sm" style="font-weight:800; color:var(--tx);">Email Pembelian</label>
      <input type="email" id="auth-email" class="input-field" placeholder="contoh: ibu@gmail.com" required>

      <label class="sm" style="font-weight:800; color:var(--tx);">No. HP</label>
      <input type="text" id="auth-pass" class="input-field" placeholder="contoh: 628123456789" required>

      <button type="submit" id="auth-btn" class="btn" style="width:100%; margin-top:6px; padding:13px 18px; font-size:15px;">Masuk ke Aplikasi</button>
    </form>

    <div class="note" style="margin-top:18px; font-size:12px;">
      Belum punya akses? Silakan lakukan pembelian terlebih dahulu di Lynk.id Tenang Bu.
    </div>
  </div>
</div>

<!-- KONTEN UTAMA APLIKASI -->
<div class="w" id="app" style="display:none;">
  <div class="card" style="text-align:center; padding:24px;">
    <h2>🌸 Selamat Datang di Tenang Bu!</h2>
    <p class="mt">Akunmu berhasil terverifikasi dari database pembeli.</p>
    <div id="user-info" class="ban" style="margin:16px 0;"></div>
    <button class="btn" onclick="handleLogout()" style="background:#C93F63; margin-top:10px;">Keluar (Logout)</button>
  </div>
</div>

<div class="toast" id="toast" style="display:none;"></div>

<script>
  // Konfigurasi Supabase Kamu
  const SUPABASE_URL = 'https://ltlpdqetmypmnhliqtaqk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZWYiOiJsdGxwZHFldG15cG1uaGxpcXRhcWsiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2MTE4MTQ0NiwiZXhwIjoyMDc2NzU3NDQ2fQ.DummyKeyPlaceholder'; // Ganti dengan anon key asli jika diperlukan atau gunakan client langsung
  
  // Inisialisasi Supabase Client (menggunakan anon key project kamu)
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0bHBkcWV0bXlwbW5obGlxdGFxaCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzYxMTgxNDQ2LCJleHAiOjIwNzY3NTc0NDZ9...');

  async function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const phone = document.getElementById('auth-pass').value.trim();
    const errBox = document.getElementById('auth-error');
    const btn = document.getElementById('auth-btn');

    errBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Memeriksa Database...';

    try {
      // Query ke tabel buyers di Supabase
      const { data, error } = await supabaseClient
        .from('buyers')
        .select('*')
        .eq('email', email)
        .eq('phone', phone);

      if (error) throw error;

      if (data && data.length > 0) {
        // Berhasil login
        localStorage.setItem('tenang_user', JSON.stringify(data[0]));
        showApp(data[0]);
      } else {
        errBox.textContent = 'Email atau No. HP tidak ditemukan di daftar pembeli. Pastikan data sesuai saat order di Lynk.id.';
        errBox.style.display = 'block';
      }
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Gagal terhubung ke database Supabase. Coba beberapa saat lagi.';
      errBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Masuk ke Aplikasi';
    }
  }

  function showApp(user) {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-info').innerHTML = `Login sebagai: <b>${user.email}</b><br>No. HP: <b>${user.phone}</b>`;
  }

  function handleLogout() {
    localStorage.removeItem('tenang_user');
    location.reload();
  }

  // Cek sesi login saat halaman dimuat
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('tenang_user');
    if (saved) {
      showApp(JSON.parse(saved));
    }
  });
</script>
</body>
</html>
