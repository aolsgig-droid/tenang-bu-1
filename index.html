<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tenang Bu: pendamping harian ibu dan balita</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF5F0;--sf:#fff;--tx:#3A2E39;--mt:#7A6270;--pr:#C93F63;--pt:#fff;--ac:#FFD97A;--ln:#F7DDD8;--wn:#B8431F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:640px;margin:0 auto;padding:18px 16px 96px}
h1{font-size:30px;line-height:1.15;margin:6px 0 4px;font-weight:800}
h2{font-size:19px;margin:0 0 8px;font-weight:800}
h3{font-size:16px;margin:12px 0 4px;font-weight:800}
p{margin:6px 0}ul{margin:6px 0;padding-left:20px}li{margin:4px 0}
.mt{color:var(--mt)}.sm{font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
.note{font-size:13px;color:var(--mt);border-left:3px solid var(--ac);padding-left:10px;margin:14px 0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#C93F63,#E0677F);color:var(--pt);border:0;border-radius:20px;padding:22px 20px;margin:14px 0}
.hero b{display:block;font-size:22px;font-weight:800}.hero span{opacity:.9}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:12px;padding:11px 18px;font-weight:800}
.btn.g{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--bg);border:1.5px solid var(--ln);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:800}
details{border-top:1px solid var(--ln);padding:10px 0}details:first-of-type{border-top:0}
summary{font-weight:800;cursor:pointer}
.say{background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:600}
.no{color:var(--wn);font-weight:600}
.tag{font-size:12px;background:var(--ac);color:#2B2433;border-radius:6px;padding:1px 7px;font-weight:800;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--mt)}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--pr);font-weight:800}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.ban{background:var(--ac);color:#2B2433;border-radius:12px;padding:10px 14px;font-weight:800;margin:8px 0}
.br{width:130px;height:130px;border-radius:50%;background:var(--pr);color:var(--pt);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;margin:18px auto;transition:transform 4s ease-in-out;padding:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--ln)}.dots i.on{background:var(--pr)}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:8px 0}label.ck input{margin-top:5px;width:18px;height:18px;accent-color:var(--pr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;z-index:30}
@media (prefers-reduced-motion:reduce){.br{transition:none}}
a{color:var(--pr);font-weight:700}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate .card{max-width:420px;margin:24px auto}
input{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--tx);margin:4px 0 12px}
.err{color:var(--wn);font-weight:700;min-height:1.6em;margin-bottom:6px}
body.locked #app,body.locked #nav{display:none}
</style></head><body class="locked">
<div class="w" id="app"></div><div id="ov"></div>
<div id="gate" class="gate"><div class="card"><h1 style="font-size:26px">Tenang, Bu.</h1>
<p class="mt">Masuk dengan email dan nomor HP yang dipakai saat order di Lynk.id.</p>
<form onsubmit="doLogin();return false">
<label for="ge"><b>Email</b></label><input id="ge" type="email" autocomplete="email" inputmode="email" placeholder="nama@email.com">
<label for="gp"><b>Nomor HP</b></label><input id="gp" type="tel" autocomplete="tel" inputmode="tel" placeholder="0812xxxxxxx">
<div class="err" id="gmsg" role="alert"></div>
<button class="btn" id="gb" style="width:100%">Masuk</button></form>
<p class="sm mt" style="margin-top:14px">Belum punya akses? <a href="#" id="glk">Beli di Lynk.id</a>.</p></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TABS=[['🧸','Tantrum'],['📱','Layar'],['💬','Kata'],['📓','Jurnal'],['🤍','Ibu']];
let tab=0;
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const go=i=>{tab=i;draw();scrollTo(0,0)};

/* ---------- Panduan tantrum ---------- */
const GS=[
{t:'Napas dulu, Bu',b:'Anak boleh menangis. Tugas Ibu sekarang cuma satu: menenangkan diri sendiri. Anak menyerap ketenangan Ibu.',br:1},
{t:'Pastikan aman',b:'Jauhkan benda keras atau tajam. Di tempat umum, pindah ke sudut yang lebih sepi. Tidak perlu malu, tantrum itu wajar di usia ini.'},
{t:'Turunkan badan dan suara',b:'Duduk sejajar dengan mata anak dan bicara pelan. Saat sedang meledak, anak belum bisa diajak berpikir, jadi sedikit kata lebih baik.'},
{t:'Beri nama perasaannya',b:['Cukup satu kalimat pendek.','Sebutkan perasaannya, lalu batasnya.'],s:['“Kamu marah ya. Ibu di sini.”','“Kamu kesal karena TV dimatikan. Kesal boleh, memukul tidak boleh.”']},
{t:'Tunggu sampai reda',b:['Tawarkan pelukan tanpa memaksa. Kalau menolak, duduk di dekatnya saja. Jangan memberi yang diminta hanya supaya diam, agar anak tidak belajar bahwa menangis keras itu berhasil.','Tawarkan sudut tenang, atau ajak tarik napas dan hitung sampai 5 bersama. Tetap pegang aturan yang sudah disepakati.'],s:['“Ibu tunggu di sini sampai kamu siap.”','“Mau peluk atau mau sendiri dulu? Ibu tunggu.”']},
{t:'Setelah tenang',b:['Peluk, lalu alihkan ke kegiatan lain. Tidak perlu ceramah.','Ngobrol 1–2 kalimat: apa yang terjadi dan apa yang bisa dilakukan lain kali. Puji saat anak berhasil tenang.'],s:['“Sudah tenang ya. Yuk kita main balok.”','“Tadi kamu marah sekali, dan sekarang sudah tenang. Lain kali bilang ‘aku mau lima menit lagi’ ya.”'],end:1}];
let g={age:0,i:0,iv:null};
const pk=x=>Array.isArray(x)?x[g.age]:x;
function openGuide(){g={age:g.age||0,i:0,iv:null};gDraw()}
function closeGuide(){clearInterval(g.iv);$('#ov').innerHTML=''}
function gDraw(){
 clearInterval(g.iv);const s=GS[g.i];
 $('#ov').innerHTML=`<div class="ov"><div class="w" style="padding-bottom:20px">
 <div class="row" style="justify-content:space-between;align-items:center"><b>Panduan tantrum</b><button class="btn g" onclick="closeGuide()">Tutup</button></div>
 <div class="row">${['Anak 1–3 tahun','Anak 4–6 tahun'].map((a,i)=>`<button class="chip ${g.age==i?'on':''}" onclick="g.age=${i};gDraw()">${a}</button>`).join('')}</div>
 <div class="dots">${GS.map((_,i)=>`<i class="${i<=g.i?'on':''}"></i>`).join('')}</div>
 <div class="card"><p class="mt sm">Langkah ${g.i+1} dari ${GS.length}</p><h2>${s.t}</h2><p>${pk(s.b)}</p>
 ${s.s?`<div class="say">${pk(s.s)}</div>`:''}
 ${s.br?`<div class="br" id="br">Siap?</div><div class="row" style="justify-content:center"><button class="btn" onclick="breathe()">Mulai napas 3 kali</button></div>`:''}
 ${s.end?`<h3 class="no">Hindari</h3><p class="sm">Mengancam, memukul, mempermalukan anak, atau menyerah pada permintaan hanya demi suasana tenang.</p>`:''}</div>
 <div class="row" style="justify-content:space-between">
 <button class="btn g" ${g.i?'':'disabled'} onclick="g.i--;gDraw()">Kembali</button>
 ${g.i<GS.length-1?`<button class="btn" onclick="g.i++;gDraw()">Lanjut</button>`:`<button class="btn" onclick="closeGuide();go(3)">Catat di jurnal</button>`}</div>
 <p class="note">Sering tantrum hingga melukai diri atau orang lain, atau sangat lama? Konsultasikan ke dokter anak atau psikolog anak.</p></div></div>`}
function breathe(){
 const c=$('#br');let n=0,up=true;clearInterval(g.iv);
 const step=()=>{if(n>=3){clearInterval(g.iv);c.style.transform='scale(1)';c.textContent='Sudah. Lanjut ya, Bu.';return}
  c.textContent=up?'Tarik napas… 4 detik':'Hembuskan… 4 detik';c.style.transform=up?'scale(1.45)':'scale(1)';if(!up)n++;up=!up};
 step();g.iv=setInterval(step,4000)}

/* ---------- Layar ---------- */
let tm=null;
const IDEAS=[
['a','Tangkap gelembung','Air, sabun cuci piring, sedotan','Tiup gelembung, ajak anak menangkap dan menunjuknya.','Melatih fokus mata dan gerak badan.'],
['a','Kotak harta','Kardus, benda rumah yang aman dan besar (sendok kayu, kain, gelas plastik)','Isi kardus, biarkan anak mengeluarkan dan menyebut bendanya.','Rasa ingin tahu dan kosakata.'],
['a','Pindah air dengan spons','Dua baskom, spons','Anak memindahkan air dari satu baskom ke baskom lain.','Motorik halus dan koordinasi tangan.'],
['a','Musik panci','Panci, sendok kayu','Pukul pelan mengikuti irama lagu sederhana.','Ritme dan pendengaran.'],
['a','Jalan titian','Selotip kertas di lantai','Tempel garis lurus atau zig-zag, anak berjalan di atasnya.','Keseimbangan dan motorik kasar.'],
['a','Tebak suara','Benda rumah yang berbunyi','Bunyikan benda di balik punggung, anak menebak.','Pendengaran dan konsentrasi.'],
['b','Berburu warna','Tidak perlu alat','Sebut satu warna, anak mencari benda berwarna itu di rumah.','Mengenal warna dan mengamati.'],
['b','Kantong tebak benda','Kantong kain, benda rumah','Anak meraba tanpa melihat lalu menebak.','Indra peraba dan bahasa.'],
['b','Lompat petak','Selotip kertas','Buat petak bernomor di lantai, anak melompat sambil berhitung.','Berhitung dan motorik kasar.'],
['b','Menara gelas','Gelas plastik','Susun setinggi mungkin, lalu robohkan bersama.','Koordinasi mata dan tangan, kesabaran.'],
['b','Boneka kaus kaki','Kaus kaki bekas, spidol','Gambar wajah, lalu buat cerita sederhana bersama.','Imajinasi dan bahasa.'],
['b','Lomba tiup kapas','Kapas, sedotan','Tiup kapas dari garis awal ke garis akhir.','Kontrol napas dan fokus.']];
let ia='all';
function tStart(m){tm={end:Date.now()+m*60000,w5:0,w1:0,done:0};clearInterval(tm.id);tm.id=setInterval(tTick,500);tTick()}
function tStop(){clearInterval(tm&&tm.id);tm=null;draw()}
function tTick(){
 if(!tm)return;const r=Math.max(0,Math.round((tm.end-Date.now())/1000));
 const v=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
 if(r<=300&&!tm.w5){tm.w5=1;v(200)}if(r<=60&&!tm.w1){tm.w1=1;v(200)}
 if(r==0&&!tm.done){tm.done=1;clearInterval(tm.id);v([300,100,300])}
 const e=$('#tm');if(!e)return;
 e.querySelector('.big').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
 e.querySelector('.ban').textContent=r==0?'Waktu habis. Matikan bersama anak, lalu ajak ke kegiatan berikutnya.':r<=60?'Sisa 1 menit. Ingatkan anak sekarang.':r<=300?'Sisa 5 menit. Beri tahu anak bahwa sebentar lagi selesai.':'Layar sedang berjalan. Ibu tetap temani ya.'}
function vLayar(){
 const rules=['Tidak ada layar saat makan','Tidak ada layar 1 jam sebelum tidur','Waktu layar di jam yang sama setiap hari','Ayah dan Ibu juga mengurangi HP di depan anak','Semua pengasuh sudah tahu aturannya'];
 const ck=S.get('rules',[]);
 const list=IDEAS.filter(x=>ia=='all'||x[0]==ia);
 return `<h1>Layar, tanpa drama</h1><p class="mt">Batas waktu, timer, dan ide pengganti.</p>
 <div class="card"><h2>Berapa lama yang wajar?</h2><ul><li><b>Di bawah 2 tahun:</b> tidak dianjurkan, kecuali video call dengan keluarga (anjuran IDAI).</li><li><b>2 tahun ke atas:</b> maksimal 1 jam per hari, makin sedikit makin baik.</li></ul><p class="sm mt">Tontonan edukatif pun tetap bisa memicu tantrum saat berhenti, jadi akhir yang jelas itu penting.</p></div>
 <div class="card"><h2>Timer layar</h2>${tm?`<div id="tm"><div class="big">--:--</div><div class="ban"></div></div><div class="row"><button class="btn g" onclick="tStop()">Hentikan timer</button></div>`:`<p class="sm mt">Pilih durasi. Aplikasi mengingatkan di sisa 5 menit dan 1 menit.</p><div class="row">${[10,20,30,45,60].map(m=>`<button class="chip" onclick="tStart(${m});draw()">${m} menit</button>`).join('')}</div>`}<p class="note">Biarkan halaman ini tetap terbuka agar pengingat berjalan.</p></div>
 <div class="card"><h2>Aturan keluarga</h2>${rules.map((r,i)=>`<label class="ck"><input type="checkbox" ${ck.includes(i)?'checked':''} onchange="rl(${i},this.checked)"><span>${r}</span></label>`).join('')}</div>
 <div class="card"><h2>Cara mengakhiri layar</h2><ul><li>Peringatkan di sisa 5 menit dan 1 menit.</li><li>Beri pilihan: <i>“Mau Ibu matikan, atau kamu yang matikan?”</i></li><li>Sebutkan kegiatan sesudahnya: <i>“Habis ini kita main gelembung.”</i></li><li>Kalau tetap menangis, buka tab Tantrum.</li></ul></div>
 <div class="card"><h2>Ide pengganti layar</h2><div class="row">${[['all','Semua'],['a','1–3 th'],['b','4–6 th']].map(a=>`<button class="chip ${ia==a[0]?'on':''}" onclick="ia='${a[0]}';draw()">${a[1]}</button>`).join('')}</div>
 ${list.map(x=>`<details><summary>${x[1]}<span class="tag">${x[0]=='a'?'1–3 th':'4–6 th'}</span></summary><p><b>Bahan:</b> ${x[2]}</p><p><b>Cara:</b> ${x[3]}</p><p><b>Manfaat:</b> ${x[4]}</p></details>`).join('')}
 <p class="note">Untuk anak kecil, dampingi selalu dan jauhkan benda yang bisa tertelan.</p></div>`}
function rl(i,on){let c=S.get('rules',[]);c=on?[...new Set([...c,i])]:c.filter(x=>x!=i);S.set('rules',c)}

/* ---------- Kata ---------- */
const SC=[
['Tidak mau berhenti nonton',['“Sebentar lagi selesai ya, lima menit lagi.”','“Mau Ibu matikan atau kamu yang matikan?”','“Habis ini kita main ___.”'],'Mengambil remote atau HP tiba-tiba tanpa aba-aba.','Beri peringatan dua kali dan pakai timer yang sama setiap hari.'],
['Menolak makan',['“Ibu taruh di piring. Kamu mau makan yang mana dulu?”','“Kalau belum mau, tidak apa-apa. Makan berikutnya jam ___.”'],'Memarahi, memaksa, atau membujuk sambil menyodorkan gawai.','Suasana makan yang menyenangkan. Jangan dekatkan jam makan dengan jam tidur. Jika sangat sulit makan, tanyakan ke dokter anak.'],
['Minta sesuatu di toko',['“Kamu mau sekali ya. Hari ini kita tidak beli itu.”','“Mau pilih satu: pegang troli atau cari apel?”'],'Membeli demi menghentikan tangisan.','Bilang aturan sebelum masuk toko dan beri tugas kecil.'],
['Tidak mau tidur',['“Sebentar lagi waktunya tidur. Mau baca buku yang mana?”','“Ibu temani lima menit, lalu Ibu keluar.”'],'Mengancam atau menakut-nakuti.','Rutinitas yang sama setiap malam dan tanpa layar satu jam sebelumnya.'],
['Memukul atau melempar',['“Berhenti. Ibu tidak akan membiarkan kamu memukul.”','“Kamu marah. Pukul bantal, bukan Ibu.”'],'Membalas memukul atau berteriak.','Hentikan tangannya dengan tenang, lalu bahas setelah anak reda.'],
['Rebutan mainan',['“Kamu mau mainan itu dan temanmu juga. Kita pakai timer, giliran kamu sebentar lagi.”','“Ada dua. Mau yang biru atau merah?”'],'Memaksa anak langsung berbagi.','Tawarkan giliran dengan bantuan timer.']];
function vKata(){return `<h1>Kalimat yang bisa dipakai</h1><p class="mt">Ketuk situasi untuk melihat kalimat siap pakai.</p><div class="card">${SC.map(s=>`<details><summary>${s[0]}</summary><h3>Coba bilang</h3>${s[1].map(x=>`<div class="say">${x}</div>`).join('')}<h3 class="no">Hindari</h3><p class="sm">${s[2]}</p><h3>Tips</h3><p class="sm">${s[3]}</p></details>`).join('')}</div>`}

/* ---------- Jurnal ---------- */
const TR=['Layar dimatikan','Minta sesuatu','Lapar atau mengantuk','Berpisah dari ibu','Rebutan mainan','Tidak tahu'],DU=['Kurang dari 5 menit','5–15 menit','Lebih dari 15 menit'],WK=['Pelukan','Dialihkan','Dibiarkan tenang dulu','Menyanyi atau menghitung','Belum ada yang berhasil'];
const TIPS={'Layar dimatikan':'Pakai timer dan peringatan 5 menit sebelum selesai.','Minta sesuatu':'Sampaikan aturan sebelum keluar rumah dan beri pilihan kecil.','Lapar atau mengantuk':'Coba majukan jam makan atau tidur. Anak lelah lebih mudah meledak.','Berpisah dari ibu':'Buat salam perpisahan yang singkat dan sama setiap kali.','Rebutan mainan':'Siapkan mainan kembar dan giliran dengan timer.','Tidak tahu':'Catat beberapa hari lagi. Polanya biasanya muncul.'};
let jf={tr:'',du:'',wk:''};
const topOf=(a,k)=>{const c={};a.forEach(x=>{if(x[k])c[x[k]]=(c[x[k]]||0)+1});const e=Object.entries(c).sort((p,q)=>q[1]-p[1])[0];return e?e[0]:''};
function jc(k,v){jf[k]=jf[k]==v?'':v;draw()}
function jSave(){if(!jf.tr)return;const a=S.get('jr',[]);a.unshift({t:Date.now(),...jf});S.set('jr',a.slice(0,200));jf={tr:'',du:'',wk:''};toast('Tersimpan');draw()}
function jDel(t){S.set('jr',S.get('jr',[]).filter(x=>x.t!=t));draw()}
function vJurnal(){
 const a=S.get('jr',[]);
 const chips=(k,arr)=>`<div class="row">${arr.map(v=>`<button class="chip ${jf[k]==v?'on':''}" onclick="jc('${k}','${v}')">${v}</button>`).join('')}</div>`;
 const hr=topOf(a.map(x=>({h:new Date(x.t).getHours()+'.00'})),'h'),tt=topOf(a,'tr'),ww=topOf(a.filter(x=>x.wk!='Belum ada yang berhasil'),'wk');
 return `<h1>Jurnal tantrum</h1><p class="mt">Catat singkat, lalu lihat polanya.</p>
 <div class="card"><h2>Catat kejadian</h2><h3>Pemicunya</h3>${chips('tr',TR)}<h3>Lama</h3>${chips('du',DU)}<h3>Yang membantu</h3>${chips('wk',WK)}<div class="row"><button class="btn" ${jf.tr?'':'disabled'} onclick="jSave()">Simpan</button></div></div>
 ${a.length>=3?`<div class="card"><h2>Pola dari ${a.length} catatan</h2><ul><li>Pemicu paling sering: <b>${tt}</b></li><li>Jam paling rawan: sekitar <b>${hr}</b></li>${ww?`<li>Yang paling sering membantu: <b>${ww}</b></li>`:''}</ul><p class="sm">${TIPS[tt]||''}</p></div>`:`<div class="card"><p class="sm mt">${a.length?`Baru ${a.length} catatan. Pola akan muncul setelah 3 catatan.`:'Belum ada catatan. Setelah tantrum berikutnya, catat di sini.'}</p></div>`}
 ${a.slice(0,10).map(x=>`<div class="card sm"><b>${esc(x.tr)}</b> · ${esc(x.du||'-')}<br>Membantu: ${esc(x.wk||'-')}<br><span class="mt">${new Date(x.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span> <button class="chip" style="float:right" onclick="jDel(${x.t})">Hapus</button></div>`).join('')}

/* ---------- Ibu ---------- */
const BQ=['Lelah sampai sulit bangkit, meski sudah istirahat','Mudah tersulut emosi pada anak','Merasa tidak cukup baik sebagai ibu','Ingin menghindar dari orang lain','Tidak punya waktu untuk diri sendiri','Nafsu makan atau pola tidur berubah'];
let bo=BQ.map(()=>null),bs=0;
function ba(i,v){bo[i]=v;bs=0;draw()}
function vIbu(){
 const done=bo.every(x=>x!==null),sc=bo.reduce((a,b)=>a+(b||0),0);
 const res=sc<=5?['Masih terkendali','Pertahankan waktu istirahat kecil setiap hari.']:sc<=11?['Mulai kewalahan','Kurangi satu tanggung jawab minggu ini dan minta bantuan pasangan, keluarga, atau teman.']:['Kelelahan tinggi','Bicarakan dengan orang terdekat dan pertimbangkan bertemu psikolog, dokter, atau tenaga puskesmas. Ibu layak mendapat dukungan.'];
 return `<h1>Ibu juga perlu dijaga</h1><p class="mt">Cek singkat kondisi Ibu dalam dua minggu terakhir.</p>
 <div class="card"><h2>Cek kelelahan</h2>${BQ.map((q,i)=>`<h3>${q}</h3><div class="row">${['Tidak pernah','Kadang','Sering','Hampir selalu'].map((l,v)=>`<button class="chip ${bo[i]===v?'on':''}" onclick="ba(${i},${v})">${l}</button>`).join('')}</div>`).join('')}
 <div class="row"><button class="btn" ${done?'':'disabled'} onclick="bs=1;draw()">Lihat hasil</button></div>
 ${bs&&done?`<div class="ban" style="margin-top:12px">${res[0]} (skor ${sc} dari 18)</div><p>${res[1]}</p><p class="note">Ini bukan diagnosis. Jika Ibu merasa sangat sedih berkepanjangan atau punya pikiran menyakiti diri atau anak, segera hubungi tenaga kesehatan atau orang terdekat.</p>`:''}</div>
 <div class="card"><h2>Tujuh kebiasaan kecil</h2><ul><li>Minta bantuan sebelum benar-benar lelah.</li><li>Turunkan target, tidak perlu jadi ibu sempurna.</li><li>Sisihkan 10 menit untuk diri sendiri.</li><li>Jaga jadwal tidur dan makan anak agar hari lebih bisa diprediksi.</li><li>Berhenti membandingkan anak dengan anak lain.</li><li>Cari teman sesama ibu untuk saling bergantian menjaga anak.</li><li>Kumpulkan kenangan baik, bukan kesempurnaan.</li></ul></div>
 <div class="card"><h2>Bagikan ke ibu lain</h2><p class="sm">Kalau aplikasi ini membantu, kirim ke teman atau grup ibu-ibu.</p><div class="row"><button class="btn" onclick="share()">Bagikan</button></div></div>
 <p class="note">Aplikasi ini panduan umum, bukan pengganti dokter atau psikolog.</p><div class="row"><button class="chip" onclick="logout()">Keluar dari akun ini</button></div>`}
function share(){
 const tx='Aku pakai Tenang Bu: panduan saat anak tantrum, timer layar, dan jurnal. Coba juga ya, Bu: '+location.href.split('#')[0];
 try{if(navigator.share){navigator.share({text:tx}).catch(()=>{});return}}catch(e){}
 try{navigator.clipboard.writeText(tx).then(()=>toast('Teks disalin'),()=>toast('Salin manual dari alamat halaman'));}catch(e){toast('Salin manual dari alamat halaman')}}

draw();
